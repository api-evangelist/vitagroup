gaps:
- No RFC 9457 problem+json envelope, no machine-readable error code, and no error-code
  reference page. A client branches on the HTTP status and reads prose.
- The openEHR and Item Tag specs declare NO 401 or 403 responses at all, even though
  the same server can be started with Basic or OAuth2 required. A generated client
  built from those contracts will not expect an auth failure.
- The Item Tag experimental spec declares no error responses whatsoever — only 200 and
  204.
- 500-class responses are not declared on any operation in any published document.
