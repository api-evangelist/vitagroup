  declared_in_spec: false
  meaning: >-
    Not declared in any published spec, but named in the Transaction Compensation
    documentation: an exception representing a 500 or 501 during a rollback causes the
    whole compensation transaction to be rolled back.
  source: https://docs.ehrbase.org/docs/EHRbase/Enterprise-Features/Transaction-Compensation
  retryable: true
