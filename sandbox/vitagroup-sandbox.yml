generated: '2026-09-02'
method: probed
source: https://sandkiste.ehrbase.org/
docs: https://docs.ehrbase.org/
note: >-
  vitagroup runs a public EHRbase sandbox — "sandkiste" is German for sandbox — linked
  from the EHRbase docs navigation and from ehrbase.org. It is a real running server,
  not a mock: /ehrbase/rest/status returns live build and database versions and
  /ehrbase/v3/api-docs serves a springdoc OpenAPI document generated by that instance.
  The REST surface is reachable with NO credentials, because the instance runs with
  EHRbase's default AUTH_TYPE=NONE.
sandbox:
  name: EHRbase Sandbox (sandkiste)
  url: https://sandkiste.ehrbase.org/
  api_base: https://sandkiste.ehrbase.org/ehrbase
  swagger_ui: https://sandkiste.ehrbase.org/ehrbase/swagger-ui/index.html
  openapi: https://sandkiste.ehrbase.org/ehrbase/v3/api-docs
  ui_framework: Vaadin (server-rendered Java UI at the site root)
  registration_required: false
  credentials_required: false
  auth_mode: NONE
separate_test_and_live_keys: false
key_prefixes: []
test_data:
  provided: false
  note: >-
    vitagroup publishes no fixture set, seeded patients or test tokens. The openEHR
    tutorial in the docs walks a reader through creating their own EHR, uploading an
    operational template and posting a composition, so the sandbox is a blank instance
    the visitor populates.
observed:
- probe: GET /ehrbase/rest/status
  status: 200
  content_type: application/xml
  reports:
    ehrbase_version: 2.33.0
    openehr_sdk_version: 2.33.1
    archie_version: 3.13.0
    postgres_version: PostgreSQL 16.15
- probe: GET /ehrbase/v3/api-docs
  status: 200
  content_type: application/json
  reports: OpenAPI 3.1.0, 44 paths, 63 operations, servers[0]=https://sandkiste.ehrbase.org/ehrbase
- probe: GET /ehrbase/v3/api-docs/swagger-config
  status: 200
  reports: >-
    four spec groups — "1. openEHR API", "2. EHRbase Status Endpoint",
    "3. EHRbase Admin API", "4. Management API"
- probe: GET /ehrbase/rest/openehr/v1/definition/template/adl1.4
  status: 200
  content_type: application/json
  reports: templates already loaded on the instance are listed unauthenticated
- probe: GET /ehrbase/management/health
  status: 404
  reports: Spring Actuator management endpoints are disabled on this instance
time_simulation:
  supported: false
fixture_triggers:
  supported: false
version_drift:
  note: >-
    The sandbox reported EHRbase 2.33.0 while the current published release was 2.35.1
    (2026-08-20), so the demo instance trailed the release train by two minor versions
    on the day of this probe.
gaps:
- The sandbox is shared, unauthenticated and writable, so anything created there is
  visible to and mutable by every other visitor. vitagroup states no reset schedule
  or data-retention policy for it.
- There is no separate test-vs-live key model, because HIP EHRbase is deployed per
  customer rather than offered as a vendor-hosted multi-tenant API with issued keys.
