status_page:
  published: false
  url: null
  note: >-
    No status page exists and none is expected to: HIP EHRbase is deployed on the
    customer's own infrastructure, so there is no vendor-operated production service
    whose uptime could be reported. status.vitagroup.ag does not resolve (probed,
    connection failed). No StatusPage pointer is wired into apis.yml. The runtime
    equivalent a customer gets is per-instance: GET /rest/status returns build,
    SDK, Archie, JVM and PostgreSQL versions, and Spring Actuator liveness/readiness
    and Prometheus endpoints can be enabled under /management.
  instance_health:
    status_endpoint: /rest/status
    admin_status_endpoint: /rest/admin/status
    actuator_base_path: /management
    actuator_default: disabled — opt in per endpoint via MANAGEMENT_ENDPOINT_*_ACCESS
    kubernetes_probes: /management/health/liveness, /management/health/readiness
    prometheus: /management/prometheus
    docs: https://docs.ehrbase.org/docs/EHRbase/Explore/Status-And-Metrics
sla:
