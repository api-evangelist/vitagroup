deprecation_policy:
  published: true
  form: migration guide
  url: https://github.com/ehrbase/ehrbase/blob/develop/UPDATING.md
  title: Updating EHRbase
  statement: >-
    "This file documents any backwards-incompatible changes in EHRbase and assists
    users migrating to a new version."
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  advance_notice_period_stated: false
  note: >-
    A real, maintained, per-version breaking-change guide — stronger than most
