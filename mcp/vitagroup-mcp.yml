agent_readiness_note: >-
  If vitagroup ever ships a server, the two tools that matter most are get_web_template
  and run_aql_query: an agent cannot compose a valid openEHR document without the
  template projection, and cannot find anything without AQL. The write path needs the
  If-Match round trip modelled explicitly, because a naive agent will strip the
  precondition when it hits its first 412.
