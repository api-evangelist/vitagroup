temporal_model:
  append_only: true
  detail: >-
    Nothing in the openEHR surface is overwritten. An update creates a new version;
    a delete creates a version whose lifecycle state is "deleted". Every versioned
    entity is readable at an arbitrary instant via the version_at_time query
    parameter (5 operations) or by explicit version_uid. Physical removal exists only
    behind the Admin API.
