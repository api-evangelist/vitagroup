openapi: 3.2.0
info:
  title: HIP EHRbase Event Trigger API
  description: 'HIP EHRbase Enterprise operations that are not part of the OSS, but are part of enterprise feature.

    Requires authorization with a tenant user upfront.'
  version: 2.0.0
  contact: {}
servers:
- url: https://{ehrbaseBaseUrl}
  description: An example HIP EHRbase API URL.
  variables:
    ehrbaseBaseUrl:
      default: hip-ehrbase.dev
security:
- bearerAuth: []
tags:
- name: Event Trigger
paths:
  /plugin/event-trigger/service/:
    get:
      tags:
      - Event Trigger
      summary: Get All Event Triggers
      operationId: getAll
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: string
          default: 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTrigger'
    post:
      tags:
      - Event Trigger
      summary: Create Event Trigger
      operationId: store
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTrigger'
            example:
              id: composition_trigger_v1
              language:
                original_language: ISO_639-1::en
              state: active
              author:
                date: '2021-11-02T00:00:00.000+00:00'
                name: Me
                email: info@vitagroup.ag
                organisation: VitaGroup AG
              definition:
                mode: AFTER
                data_type: COMPOSITION
                event_type:
                - CREATE
                - UPDATE
                - DELETE
                rules:
                - high diastolic:
                    when:
                      aql: select c/uid/value as diastolic from EHR e contains COMPOSITION c
                    then:
                    - notify:
                        command: publish
                        channel: amqp
                        exchange: ex
                        routing-key: ex
                    - log:
                        command: notify
                        channel: logger
                pre_condition: []
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
  /plugin/event-trigger/service/{uuid}:
    put:
      tags:
      - Event Trigger
      summary: Activate Event Trigger
      operationId: activate
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          example: 06345e0e-3b79-4dba-8c99-c0e632d328bf
          format: uuid
      - name: activate
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: NOT FOUND
          content:
            text/plain:
              schema:
                type: string
  /plugin/event-trigger/service/{id}:
    get:
      tags:
      - Event Trigger
      summary: Get Event Trigger By Trigger-Id Or Trigger-UUID
      operationId: getBy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTrigger'
        '404':
          description: NOT FOUND
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
      - Event Trigger
      summary: Delete Event Trigger By Trigger-UUID
      operationId: deleteBy
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: c1246a5c-07e8-4601-a5b5-7eab501d3bd9
      responses:
        '200':
          description: OK
        '404':
          description: NOT FOUND
components:
  schemas:
    Languange:
      type: object
      properties:
        original_language:
          type: string
    EventTrigger:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        id:
          type: string
        language:
          $ref: '#/components/schemas/Languange'
        state:
          type: string
          enum:
          - active
          - inactive
        author:
          $ref: '#/components/schemas/Author'
        definition:
          $ref: '#/components/schemas/Definition'
    Rule:
      type: object
      properties:
        name:
          type: string
        conditions:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
        when:
          $ref: '#/components/schemas/Condition'
        then:
          type: array
          items:
            $ref: '#/components/schemas/Consequence'
    Definition:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        data_type:
          type: string
          enum:
          - EHR_STATUS
          - COMPOSITION
        event_type:
          type: array
          items:
            type: string
            enum:
            - CREATE
            - UPDATE
            - DELETE
            - HARD_DELETE
            - ROLLBACK
        pre_condition:
          type: array
          items:
            type: string
    Consequence:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - SPEL
          - AQL
          - EL
        arguments:
          type: object
          additionalProperties:
            type: string
    Author:
      type: object
      properties:
        date:
          type: string
          format: date-time
        name:
          type: string
        email:
          type: string
        organisation:
          type: string
    Condition:
      type: object
      properties:
        type:
          type: string
        expression:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
