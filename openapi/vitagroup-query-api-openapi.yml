            application/xml:
              schema:
                $ref: '#/components/schemas/QueryResponseData'
    post:
      tags:
      - Query
      summary: Execute stored query
      externalDocs:
        url: https://specifications.openehr.org/releases/ITS-REST/latest/query.html#query-execute-query-post-1
