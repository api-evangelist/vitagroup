components:
  schemas:
    QueryResponseData:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/MetaData'
        q:
          type: string
        name:
          type: string
        columns:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        rows:
          type: array
          items:
            type: array
            items: {}
    MetaData:
      type: object
      properties:
        _href:
          type: string
        _type:
          type: string
        _schema_version:
          type: string
        _created:
          type: string
          format: date-time
        _generator:
          type: string
        _executed_aql:
          type: string
externalDocs:
  description: EHRbase Documentation
