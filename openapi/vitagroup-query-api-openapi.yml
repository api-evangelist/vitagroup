  /rest/openehr/v1/query/aql:
    get:
      tags:
      - Query
      summary: Execute ad-hoc (non-stored) AQL query
      externalDocs:
        url: https://specifications.openehr.org/releases/ITS-REST/latest/query.html#query-execute-query-get
