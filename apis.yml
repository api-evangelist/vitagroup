apis:
- aid: vitagroup:hip-ehrbase-openehr
  name: HIP EHRbase openEHR REST API
  description: EHRbase's implementation of the official openEHR REST API (ITS-REST)
    — EHR, EHR_STATUS, COMPOSITION, DIRECTORY, CONTRIBUTION, versioned objects, ADL
    1.4 / ADL 2 template definitions and Archetype Query Language (AQL) execution,
    plus the EHRbase status heartbeat. 31 paths / 45 operations.
  humanURL: https://docs.ehrbase.org/api/hip-ehrbase/openehr
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  tags:
  - openEHR
  - Electronic Health Records
  - Clinical Data Repository
  - AQL
  properties:
  - type: OpenAPI
    url: openapi/vitagroup-hip-ehrbase-openehr.json
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Explore/openEHR-REST
  - type: Overlay
    url: overlays/vitagroup-hip-ehrbase-openehr-overlay.yaml
- aid: vitagroup:hip-ehrbase-admin
  name: HIP EHRbase Admin API
  description: EHRbase's non-standard administrative API — hard delete and update of
    EHRs, compositions, contributions, directories, stored queries and templates, plus
    the HIP EHRbase Merge EHR operations (merge, merge status, merge details, merge
    target). 8 paths / 11 operations, admin role required.
  humanURL: https://docs.ehrbase.org/api/hip-ehrbase/admin
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  tags:
  - openEHR
  - Administration
  - Electronic Health Records
  properties:
  - type: OpenAPI
    url: openapi/vitagroup-hip-ehrbase-admin.json
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Explore/Admin-REST
  - type: Overlay
    url: overlays/vitagroup-hip-ehrbase-admin-overlay.yaml
- aid: vitagroup:hip-ehrbase-item-tags
  name: HIP EHRbase Item Tag Experimental API
  description: Experimental EHRbase API for attaching, reading and deleting ITEM_TAG
    key/value annotations on EHR_STATUS and COMPOSITION versioned objects, addressed
    by openEHR path. 2 paths / 6 operations. Marked experimental by the provider.
  humanURL: https://docs.ehrbase.org/api/hip-ehrbase/tags
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  tags:
  - openEHR
  - Tagging
  - Experimental
  properties:
  - type: OpenAPI
    url: openapi/vitagroup-hip-ehrbase-item-tags.json
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Explore/Item-Tags
  - type: Overlay
    url: overlays/vitagroup-hip-ehrbase-item-tags-overlay.yaml
- aid: vitagroup:hip-ehrbase-enterprise
  name: HIP EHRbase Enterprise API
  description: The closed-source HIP EHRbase enterprise plugin API — Event Trigger
    management (AQL-defined hooks that forward composition and EHR_STATUS events over
    HTTP, AMQP/RabbitMQ or Kafka), Multi-tenant provisioning, and Transaction Compensation
    (Saga-pattern contribution rollback). 6 paths / 9 operations, bearer JWT required.
  humanURL: https://docs.ehrbase.org/api/hip-ehrbase/enterprise
  baseURL: https://{ehrbaseBaseUrl}
  tags:
  - openEHR
  - Events
  - Multi-Tenancy
  - Enterprise
  properties:
  - type: OpenAPI
    url: openapi/vitagroup-hip-ehrbase-enterprise.yml
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Enterprise-Features/Overview
  - type: Webhooks
    url: asyncapi/vitagroup-event-trigger-webhooks.yml
  - type: Overlay
    url: overlays/vitagroup-hip-ehrbase-enterprise-overlay.yaml
- aid: vitagroup:ehrbase-sandbox-live
  name: EHRbase Sandbox (live springdoc api-docs)
  description: The OpenAPI document served by vitagroup's public EHRbase sandbox instance
    at sandkiste.ehrbase.org, harvested from /ehrbase/v3/api-docs. Combines the openEHR,
    EHR-Scape (ECIS), Admin and Status surfaces of the running server — 44 paths /
    63 operations — and is the only vitagroup-published spec that carries a real, resolvable
    servers[] host rather than the generated localhost placeholder.
  humanURL: https://sandkiste.ehrbase.org/ehrbase/swagger-ui/index.html
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  tags:
  - openEHR
  - Sandbox
  - Electronic Health Records
  properties:
  - type: OpenAPI
    url: openapi/vitagroup-ehrbase-sandbox-live.json
  - type: Sandbox
    url: sandbox/vitagroup-sandbox.yml
