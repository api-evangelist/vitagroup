aid: vitagroup
name: vitagroup
description: vitagroup AG is a German health-technology company (Mannheim, HRB 727147)
  that builds the Health Intelligence Platform (HIP) — an open, vendor-neutral clinical
  data platform for hospitals, health regions and research institutions. HIP is built
  on the openEHR standard and its Clinical Data Repository is HIP EHRbase, the commercially
  supported distribution of EHRbase, the leading open-source openEHR server. vitagroup
  operates the EHRbase project (ehrbase.org names vitagroup AG as the responsible entity),
  publishes the openEHR REST, Admin, Item Tag and HIP Enterprise OpenAPI definitions
  at docs.ehrbase.org, and runs a public unauthenticated sandbox instance at sandkiste.ehrbase.org.
  FHIR and HL7v2 interoperability is provided through the CDR Bridge / FHIR Bridge and
  the openFHIR and FHIRconnect projects.
image: https://www.vitagroup.ag/wp-content/uploads/2023/09/vitagroup_Vorschau_berry_4zu3-1024x819.png
