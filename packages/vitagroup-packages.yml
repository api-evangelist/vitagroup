note: >-
  vitagroup's client-side distribution is Java-only. The openEHR SDK
  (org.ehrbase.openehr.sdk) is the first-party client library for the HIP EHRbase /
  EHRbase REST surface; the org.ehrbase.openehr coordinates are the server itself,
  published as libraries so it can be embedded or extended with plugins. Ownership:
  these coordinates belong to the EHRbase project, whose website ehrbase.org names
  vitagroup AG as the responsible legal entity in its imprint, and whose enterprise
  distribution vitagroup sells as HIP EHRbase. No npm, PyPI, NuGet, RubyGems,
  Packagist, crates.io or pkg.go.dev first-party client exists — those registries were
  searched and the only hits were third-party community work, recorded under
  third_party[] and NOT marked official.
